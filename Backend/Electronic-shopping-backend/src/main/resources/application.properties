spring.application.name=backend

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/electronic_shopping_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT Configuration
# ===============================
jwt.secret=mySuperSecretKeyWithAtLeast256BitsLength
jwt.expiration=3600000

# ===============================
# Server Configuration
# ===============================
#default server port 8080
#server.port=9090

# ===============================
# AWS S3
# ===============================
aws.region=AP_SOUTH_1
aws.bucket.name=electronicscategoryimg
